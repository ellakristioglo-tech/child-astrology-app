name: iOS App Store build

on:
  workflow_dispatch:

jobs:
  build-ios:
    # macos-26 ships Xcode 26 / iOS 26 SDK, required by Apple for new
    # submissions since 28 Apr 2026. If this runner label is unavailable,
    # switch to "macos-15" and add a "sudo xcode-select -s
    # /Applications/Xcode_26.app/Contents/Developer" step before Archive.
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Verify Xcode / iOS SDK
        run: |
          set -e
          xcodebuild -version
          SDKVER=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iphoneos SDK: $SDKVER"
          case "$SDKVER" in
            26.*|27.*|28.*|29.*|3?.*) echo "OK: iOS $SDKVER SDK meets Apple's minimum." ;;
            *) echo "::error::iOS SDK $SDKVER is below Apple's iOS 26 minimum for new submissions. Use a runner image with Xcode 26 (macos-26) or xcode-select Xcode 26."; exit 1 ;;
          esac

      - name: Install dependencies
        run: npm install

      - name: Prepare bundled web app
        run: npm run build:web

      - name: Create iOS project
        run: npx cap add ios

      - name: Sync iOS project
        run: npx cap sync ios

      - name: Install signing certificate
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          echo "$P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          echo "$PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$PROFILE_PLIST")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$PROFILE_PLIST")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"

      - name: Configure App signing
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path('ios/App/App.xcodeproj/project.pbxproj')
          s = p.read_text()
          team = os.environ['TEAM_ID']
          profile = os.environ['PROFILE_NAME']
          s = s.replace('CODE_SIGN_STYLE = Automatic;', 'CODE_SIGN_STYLE = Manual;')
          s = s.replace('DEVELOPMENT_TEAM = "";', f'DEVELOPMENT_TEAM = {team};')
          marker = 'PRODUCT_BUNDLE_IDENTIFIER = com.childastrology.app;'
          replacement = marker + f'\n\t\t\t\tDEVELOPMENT_TEAM = {team};\n\t\t\t\tCODE_SIGN_STYLE = Manual;\n\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "{profile}";'
          s = s.replace(marker, replacement)
          p.write_text(s)
          PY

      - name: Create export options
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>provisioningProfiles</key><dict>
              <key>com.childastrology.app</key><string>${PROFILE_NAME}</string>
            </dict>
          </dict></plist>
          EOF

      - name: Archive iOS app
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/ChildAstrology.xcarchive" \
            archive

      - name: Export IPA
        run: |
          mkdir -p "$RUNNER_TEMP/export"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ChildAstrology.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Child-Astrology-App-Store
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error

      - name: Upload to App Store Connect
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          set -euo pipefail

          # altool / notarytool look for the key by name in these dirs.
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"

          python3 - <<'PY'
          import os
          from pathlib import Path

          value = os.environ['APP_STORE_CONNECT_API_KEY'].strip()
          if '\\n' in value and '\n' not in value:
              value = value.replace('\\n', '\n')
          value = value.replace('\r\n', '\n').replace('\r', '\n')
          if 'BEGIN PRIVATE KEY' not in value or 'END PRIVATE KEY' not in value:
              raise SystemExit('APP_STORE_CONNECT_API_KEY does not contain a valid .p8 private key')

          key_id = os.environ['APP_STORE_CONNECT_KEY_ID'].strip()
          path = Path.home() / '.appstoreconnect' / 'private_keys' / f'AuthKey_{key_id}.p8'
          path.write_text(value + '\n')
          path.chmod(0o600)
          print(f'Wrote {path}')
          PY

          KEY_PATH="$KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

          echo "::group::App Store Connect credential diagnostics"
          echo "KEY_ID length: ${#APP_STORE_CONNECT_KEY_ID} (App Store Connect key ids are 10 chars)"
          echo "ISSUER_ID length: ${#APP_STORE_CONNECT_ISSUER_ID}"
          if printf '%s' "$APP_STORE_CONNECT_ISSUER_ID" | grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'; then
            echo "ISSUER_ID format: UUID (looks correct)"
          else
            echo "::warning::ISSUER_ID is not a UUID. It must be the Issuer ID from App Store Connect -> Users and Access -> Integrations -> App Store Connect API (top of the page), NOT the Key ID or the Team ID."
          fi
          echo "-- .p8 private key check --"
          if openssl pkey -in "$KEY_PATH" -noout -text 2>/dev/null | grep -Eq 'prime256v1|P-256|256 bit'; then
            echo ".p8 parses as an EC P-256 private key (correct for App Store Connect)"
          else
            echo "::warning::openssl could not parse the .p8 as an EC P-256 key. The APP_STORE_CONNECT_API_KEY secret is likely truncated or line-wrapped wrong. Paste the whole AuthKey_XXXXXXXXXX.p8 file, including the BEGIN/END lines."
            openssl pkey -in "$KEY_PATH" -noout -text 2>&1 | head -3 || true
          fi
          echo "-- altool auth probe (list-providers) --"
          xcrun altool --list-providers \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            && echo "AUTH OK: the API key authenticates with Apple." \
            || echo "::warning::altool --list-providers failed to authenticate (see error above). The API key / Key ID / Issuer ID combination is being rejected by Apple — regenerate the key and re-enter all three secrets (see run summary notes)."
          echo "::endgroup::"

          IPA_PATH=$(find "$RUNNER_TEMP/export" -name '*.ipa' -print -quit)
          test -n "$IPA_PATH"
          echo "Uploading $IPA_PATH"

          # altool uses the App Store Connect API key (JWT) — no Apple ID or
          # app-specific password. Validate first for clearer diagnostics
          # (non-blocking), then do the real upload.
          xcrun altool --validate-app \
            -f "$IPA_PATH" \
            --type ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            || echo "::warning::altool --validate-app reported issues above; attempting upload anyway"

          xcrun altool --upload-app \
            -f "$IPA_PATH" \
            --type ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
