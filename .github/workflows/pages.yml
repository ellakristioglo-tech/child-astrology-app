name: Deploy static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build local city search data
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://download.geonames.org/export/dump/cities15000.zip \
            --output /tmp/cities15000.zip
          unzip -q /tmp/cities15000.zip cities15000.txt -d /tmp
          node scripts/generate-cities.mjs /tmp/cities15000.txt assets/cities-15000.min.json
      - name: Privacy and security regression tests
        run: node --test tests/*.test.js
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare automatic app updates
        shell: bash
        run: |
          printf '{"version":"%s"}\n' "$GITHUB_SHA" > version.json
          sed -i "s/__APP_BUILD_VERSION__/${GITHUB_SHA}/g" index.html pwa-update.js sw.js
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
